name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROUTE_VISION_CLIENT_TOKEN: ${{ secrets.ROUTE_VISION_CLIENT_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install backend dependencies
        run: npm install --prefix backend

      - name: Validate backend syntax
        run: |
          node --check backend/src/app.js
          node --check backend/src/server.js
          node --check backend/vercel/api/health.js
          node --check backend/vercel/api/route-vision.js
          node --check backend/vercel/api/verify-google-play.js

      - name: Run backend tests
        run: npm test --prefix backend

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android runner
        run: flutter create . --platforms=android --org com.routeperformancetracker

      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Verify private beta vision secret
        shell: bash
        run: |
          if [ -z "$ROUTE_VISION_CLIENT_TOKEN" ]; then
            echo "ROUTE_VISION_CLIENT_TOKEN repository secret is not configured."
            exit 1
          fi
          if [ "${#ROUTE_VISION_CLIENT_TOKEN}" -lt 32 ]; then
            echo "ROUTE_VISION_CLIENT_TOKEN is too short."
            exit 1
          fi

      - name: Build vision-enabled debug APK
        run: >-
          flutter build apk --debug
          --dart-define=ROUTE_VISION_CLIENT_TOKEN="$ROUTE_VISION_CLIENT_TOKEN"

      - name: Upload vision-enabled APK
        uses: actions/upload-artifact@v4
        with:
          name: route-performance-tracker-vision-beta-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release-aab:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROUTE_VISION_CLIENT_TOKEN: ${{ secrets.ROUTE_VISION_CLIENT_TOKEN }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-upload.jks

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release secrets
        shell: bash
        run: |
          for value in ROUTE_VISION_CLIENT_TOKEN ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD ANDROID_KEYSTORE_BASE64; do
            if [ -z "${!value}" ]; then
              echo "$value is not configured."
              exit 1
            fi
          done

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Generate Android runner
        run: flutter create . --platforms=android --org com.routeperformancetracker

      - name: Decode upload keystore
        shell: bash
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Configure release signing
        run: python3 tool/configure_android_release_signing.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build signed release AAB
        run: >-
          flutter build appbundle --release
          --dart-define=ROUTE_VISION_CLIENT_TOKEN="$ROUTE_VISION_CLIENT_TOKEN"

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: route-performance-tracker-1.0-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
