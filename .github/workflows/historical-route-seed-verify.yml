name: Historical Route Seed Verify

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out historical route branch
        uses: actions/checkout@v4
        with:
          ref: historical-route-seed

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run historical seed tests
        run: flutter test test/historical_route_seed_service_test.dart

      - name: Run full Flutter test suite
        run: flutter test
